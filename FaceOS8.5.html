<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0A84FF">
<title>FaceOS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,sans-serif;background:#000;color:#fff}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,textarea{font-family:inherit;outline:none;border:none}
:root{--menubar:rgba(255,255,255,.72);--dock:rgba(255,255,255,.55);--win:#fff;--title:#ececec;--text:#1d1d1f;--border:rgba(0,0,0,.12);--hover:rgba(0,0,0,.06);--panel:#f8f8f8}
body.dark{--menubar:rgba(28,28,30,.75);--dock:rgba(28,28,30,.55);--win:#1e1e1e;--title:#2c2c2e;--text:#f5f5f7;--border:rgba(255,255,255,.12);--hover:rgba(255,255,255,.08);--panel:#28282a}
body[dir="rtl"]{direction:rtl}

#splash{position:fixed;inset:0;z-index:10000;background:radial-gradient(ellipse at 50% 40%,#1a2a52,#0a0e1f 70%,#000);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .6s}
#splash.hidden{opacity:0;pointer-events:none}
.mark{width:140px;height:140px;position:relative;display:flex;align-items:center;justify-content:center;animation:entrance 1s cubic-bezier(.2,.8,.2,1)}
@keyframes entrance{0%{opacity:0;transform:scale(.4) rotate(-45deg)}100%{transform:scale(1) rotate(-12deg)}}
.mark .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#3A8DFF,#9C6BFF,#FF6B9D,#3A8DFF);-webkit-mask:radial-gradient(circle,transparent 52%,#000 54%,#000 88%,transparent 90%);mask:radial-gradient(circle,transparent 52%,#000 54%,#000 88%,transparent 90%);animation:spin 6s linear infinite;filter:drop-shadow(0 0 20px rgba(58,141,255,.6))}
@keyframes spin{to{transform:rotate(360deg)}}
.mark .f{font-size:70px;font-weight:900;z-index:2;text-shadow:0 0 30px rgba(156,107,255,.8)}
.title{display:flex;flex-direction:column;align-items:center;gap:4px}
.title .main{font-size:38px;font-weight:900;letter-spacing:10px;background:linear-gradient(135deg,#fff,#9C6BFF,#3A8DFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.title .sub{font-size:18px;font-weight:700;letter-spacing:14px;color:#7f92c4}
.loader-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:20px}
.loader{width:50px;height:50px;border-radius:50%;border:3px solid rgba(255,255,255,.1);border-top-color:#3A8DFF;border-right-color:#9C6BFF;animation:spin 1s linear infinite}
.progress{width:200px;height:3px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.progress .fill{height:100%;width:0;background:linear-gradient(90deg,#3A8DFF,#9C6BFF);transition:width .2s linear}
#loadText{font-size:11px;color:#7f92c4;letter-spacing:1px}

#lock{position:fixed;inset:0;z-index:9998;background:linear-gradient(135deg,#0B1E3F,#1A3A6B,#4A2C8F);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#lock.active{display:flex}
.avatar{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#3A8DFF,#9C6BFF);display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:0 20px 60px rgba(58,141,255,.5)}
#lock h1{font-size:20px;font-weight:700}
#lock p{font-size:13px;color:#b9c7e6;max-width:280px}
#pinInput{width:100%;max-width:300px;padding:14px;font-size:20px;text-align:center;letter-spacing:6px;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;margin-top:8px}
#pinInput:focus{border-color:#3A8DFF}
.btn{padding:12px 28px;border-radius:14px;font-size:14px;font-weight:600;min-width:200px;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn-primary{background:#0A84FF;color:#fff;box-shadow:0 8px 24px rgba(10,132,255,.4)}
.btn-secondary{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.25)}
#loginError{color:#ff6b6b;font-size:13px;min-height:18px}
#loginHint{color:#7f92c4;font-size:12px;max-width:280px}

#desktop{position:fixed;inset:0;display:none;overflow:hidden;background:linear-gradient(135deg,#0b1e3f,#4a2c8f,#b3367a)}
#desktop.visible{display:block}
#desktop.wp-aurora{background:linear-gradient(135deg,#0f2027,#203a43,#2c5364)}
#desktop.wp-sunset{background:linear-gradient(135deg,#ff512f,#dd2476,#6a11cb)}
#desktop.wp-forest{background:linear-gradient(135deg,#134e5e,#71b280)}
#desktop.wp-ocean{background:linear-gradient(135deg,#2193b0,#6dd5ed)}
#desktop.wp-purple{background:linear-gradient(135deg,#4776E6,#8E54E9)}
#desktop.wp-mono{background:linear-gradient(135deg,#232526,#414345)}

.menubar{position:fixed;top:0;left:0;right:0;height:30px;z-index:100;background:var(--menubar);backdrop-filter:blur(24px);color:var(--text);display:flex;align-items:center;padding:0 14px;font-size:13px;gap:14px;border-bottom:1px solid var(--border)}
.menubar .item{cursor:pointer;padding:4px 8px;border-radius:5px}
.menubar .item:hover{background:var(--hover)}
.menubar .spacer{flex:1}
.menubar .logo-mini{font-weight:800;font-size:15px}
.menubar .clock{font-variant-numeric:tabular-nums}

.desktop-icons{position:absolute;top:44px;left:20px;display:flex;flex-direction:column;flex-wrap:wrap;max-height:calc(100vh - 200px);gap:12px;z-index:5}
body[dir="rtl"] .desktop-icons{left:auto;right:20px}
.d-icon{width:80px;text-align:center;cursor:pointer;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);font-size:12px;border-radius:8px;padding:6px 2px}
.d-icon:hover{background:rgba(255,255,255,.15)}
.d-icon .ico{width:52px;height:52px;margin:0 auto 4px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3)}

.dock{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:24px;background:var(--dock);backdrop-filter:blur(24px);border:1px solid var(--border);display:flex;gap:10px;z-index:90;box-shadow:0 8px 32px rgba(0,0,0,.25);max-width:calc(100vw - 30px);overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.dock .app{width:54px;height:54px;flex-shrink:0;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:28px;background:rgba(255,255,255,.2);transition:transform .2s;position:relative}
.dock .app:hover{transform:translateY(-10px) scale(1.15)}
.dock .app .dot{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--text);opacity:0}
.dock .app.running .dot{opacity:1}

.window{position:absolute;z-index:10;width:600px;height:420px;min-width:280px;min-height:180px;background:var(--win);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);color:var(--text);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border);animation:pop .2s}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.window.closing{animation:shrink .18s forwards}
@keyframes shrink{to{transform:scale(.85);opacity:0}}
.titlebar{height:36px;background:var(--title);display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--border);cursor:grab;flex-shrink:0}
.traffic{display:flex;gap:8px}
.traffic span{width:12px;height:12px;border-radius:50%;cursor:pointer}
.t-red{background:#ff5f57}.t-yellow{background:#febc2e}.t-green{background:#28c840}
.wtitle{flex:1;text-align:center;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbody{flex:1;overflow:auto;position:relative;display:flex;flex-direction:column}

.calc{display:flex;flex-direction:column;height:100%;background:#1c1c1e;color:#fff}
.calc-screen{padding:20px;text-align:right;font-size:40px;font-weight:300;min-height:80px;overflow:hidden}
.calc-keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#000}
.calc-key{border:none;font-size:22px;cursor:pointer;background:#333;color:#fff;display:flex;align-items:center;justify-content:center}
.calc-key:active{background:#555}
.calc-key.op{background:#ff9500}
.calc-key.fn{background:#a5a5a5;color:#000}
.calc-key.zero{grid-column:span 2}

.notepad{display:flex;flex-direction:column;height:100%}
.notepad-toolbar{display:flex;gap:4px;padding:6px;background:var(--title);border-bottom:1px solid var(--border)}
.notepad-toolbar button{padding:6px 10px;font-size:12px;border-radius:6px;background:var(--hover);color:var(--text)}
.notepad textarea{flex:1;padding:14px;font-size:14px;line-height:1.5;background:var(--win);color:var(--text);resize:none;font-family:ui-monospace,monospace}

.term{display:flex;flex-direction:column;height:100%;background:#0c0c0c;color:#0f0;font-family:ui-monospace,monospace;font-size:13px}
.term .out{flex:1;overflow-y:auto;padding:14px;line-height:1.55;white-space:pre-wrap}
.term input{background:#111;color:#0f0;padding:10px 14px;font-family:inherit;font-size:inherit;border-top:1px solid #222;width:100%}
.term .ok{color:#28c840}.term .warn{color:#febc2e}.term .info{color:#7fb3ff}.term .err{color:#ff5f57}

.photos{padding:16px;height:100%;overflow-y:auto}
.photos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.photo{aspect-ratio:1;border-radius:10px;cursor:pointer;overflow:hidden;position:relative;background:linear-gradient(135deg,#3A8DFF,#9C6BFF);display:flex;align-items:center;justify-content:center;font-size:44px}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .del{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .15s}
.photo:hover .del{opacity:1}
.photo.empty{aspect-ratio:auto;grid-column:1/-1;background:transparent;padding:30px;text-align:center;opacity:.5;font-size:13px}

.viewer{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}
.viewer.open{display:flex}
.viewer img{max-width:100%;max-height:100%;border-radius:8px}
.viewer .close{position:absolute;top:20px;right:20px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}

.camapp{padding:12px;display:flex;flex-direction:column;gap:10px;height:100%;background:#000}
.camapp video{flex:1;width:100%;object-fit:cover;border-radius:10px;transform:scaleX(-1)}
.camapp button{padding:10px 18px;border-radius:10px;background:#0A84FF;color:#fff}
.camapp button.alt{background:#ff5f57}

.clockapp{padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;background:linear-gradient(135deg,#1e1e1e,#333)}
.clockapp .time{font-size:60px;font-weight:200;color:#fff;font-variant-numeric:tabular-nums}
.clockapp .date{font-size:15px;color:#bbb;margin-top:8px}

.settings{padding:20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.settings h3{font-size:13px;text-transform:uppercase;opacity:.6;letter-spacing:1px}
.settings .row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--panel);border-radius:10px;border:1px solid var(--border);font-size:14px}
.settings select{padding:6px 10px;border-radius:6px;background:var(--win);color:var(--text);border:1px solid var(--border)}
.wp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px}
.wp-item{height:50px;border-radius:8px;cursor:pointer;border:2px solid transparent}
.wp-item.active{border-color:#0A84FF}

.game{padding:16px;display:flex;flex-direction:column;align-items:center;height:100%}
.game canvas{background:#111;border-radius:10px;touch-action:none}
.game .score{font-size:16px;font-weight:600;margin-bottom:10px}

.music{display:flex;flex-direction:column;height:100%;background:linear-gradient(160deg,#1a1a2e,#0f3460);color:#fff;overflow:hidden}
.music .content{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column}
.mp-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.mp-empty .big{font-size:70px;opacity:.4}
.mp-empty h3{font-size:17px}
.mp-empty p{font-size:13px;opacity:.6;max-width:280px;line-height:1.5}
.mp-empty button{padding:14px 28px;border-radius:14px;background:linear-gradient(135deg,#3A8DFF,#9C6BFF);color:#fff;font-size:14px;font-weight:600;cursor:pointer;border:none}
.mp-cover{width:180px;height:180px;border-radius:20px;background:linear-gradient(135deg,#3A8DFF,#9C6BFF);display:flex;align-items:center;justify-content:center;font-size:70px;margin:0 auto 20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mp-info{text-align:center;margin-bottom:20px}
.mp-info .t{font-size:17px;font-weight:700;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-info .a{font-size:13px;opacity:.6}
.mp-prog{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.mp-prog .time{font-size:11px;opacity:.6;font-variant-numeric:tabular-nums;min-width:36px;text-align:center}
.mp-prog input{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;background:rgba(255,255,255,.15);outline:none}
.mp-prog input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;cursor:pointer}
.mp-ctrl{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:20px}
.mp-ctrl button{background:transparent;color:#fff;font-size:26px;cursor:pointer;width:44px;height:44px;border-radius:50%}
.mp-ctrl .play{width:60px;height:60px;font-size:24px;background:linear-gradient(135deg,#3A8DFF,#9C6BFF)}
.mp-footer{display:flex;align-items:center;gap:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1)}
.mp-footer button{padding:8px 14px;border-radius:10px;background:rgba(255,255,255,.1);color:#fff;font-size:13px;cursor:pointer}
.mp-footer .vol{display:flex;align-items:center;gap:8px;flex:1}
.mp-footer .vol input{flex:1;-webkit-appearance:none;height:3px;border-radius:2px;background:rgba(255,255,255,.15);outline:none}
.mp-footer .vol input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;cursor:pointer}
.mp-list{margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)}
.mp-list h4{font-size:12px;text-transform:uppercase;letter-spacing:1px;opacity:.6;margin-bottom:10px}
.mp-list .item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13px}
.mp-list .item:hover{background:rgba(255,255,255,.08)}
.mp-list .item.active{background:rgba(58,141,255,.2);border:1px solid rgba(58,141,255,.4)}
.mp-list .item .n{width:24px;text-align:center;opacity:.5;font-size:11px}
.mp-list .item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-list .item .rm{width:22px;height:22px;border-radius:50%;color:rgba(255,255,255,.5);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:transparent}

#mini{position:fixed;bottom:80px;right:20px;z-index:200;background:rgba(20,20,30,.9);backdrop-filter:blur(20px);border-radius:16px;padding:12px 16px;display:none;align-items:center;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:13px;max-width:calc(100vw - 40px)}
#mini.visible{display:flex}
body[dir="rtl"] #mini{right:auto;left:20px}
#mini .mc{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#3A8DFF,#9C6BFF);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
#mini .mi{flex:1;overflow:hidden;min-width:0}
#mini .mt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
#mini .ma{font-size:11px;opacity:.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mini button{background:transparent;color:#fff;font-size:20px;width:36px;height:36px;border-radius:50%;cursor:pointer}
#audio{display:none}
#fileInput{display:none}

#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(30px);background:rgba(0,0,0,.85);color:#fff;padding:12px 22px;border-radius:24px;font-size:14px;z-index:99999;opacity:0;transition:all .3s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:640px){
  .window{width:calc(100vw - 10px)!important;height:70vh!important;left:5px!important}
  .dock{bottom:10px;padding:8px 12px;gap:8px;border-radius:20px}
  .dock .app{width:46px;height:46px;font-size:24px}
  #toast{bottom:90px}
  .mp-cover{width:150px;height:150px;font-size:60px}
  #mini{bottom:70px;right:10px;left:10px}
  body[dir="rtl"] #mini{right:10px;left:10px}
}
</style>
</head>
<body>

<div id="splash">
  <div class="mark"><div class="ring"></div><div class="f">F</div></div>
  <div class="title"><div class="main">FACE</div><div class="sub">OS</div></div>
  <div class="loader-wrap">
    <div class="loader"></div>
    <div class="progress"><div class="fill" id="fill"></div></div>
    <div id="loadText">Initializing...</div>
  </div>
</div>

<div id="lock">
  <div class="avatar">🔒</div>
  <h1 id="lockTitle">Welcome to FaceOS</h1>
  <p id="lockSub">Enter your PIN to unlock</p>
  <input type="password" id="pinInput" maxlength="64" placeholder="PIN" autocomplete="off">
  <div id="loginError"></div>
  <button class="btn btn-primary" id="btnPinSubmit">Unlock</button>
  <button class="btn btn-secondary" id="btnPinReset" style="display:none">Forgot PIN? Reset</button>
</div>

<div id="desktop">
  <div class="menubar">
    <span class="item logo-mini" id="menuLogo">F</span>
    <span class="item" id="menuFiles">Files</span>
    <span class="item" id="menuSettings">Settings</span>
    <span class="item" id="menuTheme">🌓</span>
    <span class="item" id="menuLang">فارسی</span>
    <span class="spacer"></span>
    <span class="item clock" id="clock"></span>
  </div>
  <div class="desktop-icons" id="desktopIcons"></div>
  <div class="dock" id="dock"></div>
</div>

<div class="viewer" id="viewer">
  <div class="close" id="viewerClose">✕</div>
  <img id="viewerImg" src="">
</div>

<div id="mini">
  <div class="mc">🎵</div>
  <div class="mi"><div class="mt" id="miniTitle">—</div><div class="ma" id="miniArtist">—</div></div>
  <button id="miniPrev">⏮</button>
  <button id="miniPlay">▶</button>
  <button id="miniNext">⏭</button>
</div>

<audio id="audio" preload="auto"></audio>
<input type="file" id="fileInput" accept="audio/*" multiple>

<div id="toast"></div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var LANG = localStorage.getItem('faceos_lang') || 'en';

  /* ============ SOUND ============ */
  var SoundEngine = (function(){
    var ctx=null, enabled = localStorage.getItem('faceos_sound') !== 'off';
    function getCtx(){
      if(!ctx){ var AC = window.AudioContext||window.webkitAudioContext; if(!AC) return null; ctx = new AC(); }
      if(ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    function tone(freq, dur, type, gain, start){
      var c = getCtx(); if(!c||!enabled) return;
      var t0 = c.currentTime + (start||0);
      var o = c.createOscillator(), g = c.createGain();
      o.type = type||'sine';
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(gain||0.15, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
      o.connect(g); g.connect(c.destination);
      o.start(t0); o.stop(t0+dur+0.05);
    }
    function boot(){
      if(!enabled) return;
      var c = getCtx(); if(!c) return;
      var now = c.currentTime;
      var sub = c.createOscillator(), sg = c.createGain();
      sub.type='sine'; sub.frequency.setValueAtTime(55, now);
      sg.gain.setValueAtTime(0, now);
      sg.gain.linearRampToValueAtTime(0.2, now+0.3);
      sg.gain.exponentialRampToValueAtTime(0.001, now+3);
      sub.connect(sg); sg.connect(c.destination);
      sub.start(now); sub.stop(now+3.2);
      [261.63,329.63,392.00,523.25].forEach(function(f,i){
        var o=c.createOscillator(), g=c.createGain();
        o.type='triangle'; o.frequency.setValueAtTime(f, now+i*0.08);
        g.gain.setValueAtTime(0, now+i*0.08);
        g.gain.linearRampToValueAtTime(0.1, now+i*0.08+0.15);

  var PhotoDB = (function(){

      if(dbP) return dbP;
      dbP = new Promise(function(res, rej){
        var r = indexedDB.open('faceos_photos', 1);
        r.onupgradeneeded = function(){
          var db = r.result;
          if(!db.objectStoreNames.contains('photos')) db.createObjectStore('photos', {keyPath:'id', autoIncrement:true});
        };
        r.onsuccess = function(){ res(r.result); };
        r.onerror = function(){ rej(r.error); };
      });
      return dbP;
    }
    function add(blob, meta){
      return open().then(function(db){
        return new Promise(function(res, rej){
          var tx = db.transaction('photos', 'readwrite');
          var st = tx.objectStore('photos');
          var rec = Object.assign({blob:blob, created:Date.now()}, meta||{});
          var req = st.add(rec);
          req.onsuccess = function(){ res(req.result); };
          req.onerror = function(){ rej(req.error); };
        });
      });
    }
    function all(){
      return open().then(function(db){
        return new Promise(function(res, rej){
          var tx = db.transaction('photos', 'readonly');
          var req = tx.objectStore('photos').getAll();
          req.onsuccess = function(){ res(req.result.sort(function(a,b){return b.created-a.created;})); };
          req.onerror = function(){ rej(req.error); };
        });
      });
    }
    function remove(id){
      return open().then(function(db){
        return new Promise(function(res, rej){
          var tx = db.transaction('photos', 'readwrite');
          var req = tx.objectStore('photos').delete(id);
          req.onsuccess = function(){ res(); };
          req.onerror = function(){ rej(req.error); };
        });
      });
    }
    return {add:add, all:all, remove:remove};
  })();

  /* ============ VFS ============ */
  var VFS = (function(){
    var dbP = null;
    var TOTAL = 50*1024*1024;
    function open(){
      if(dbP) return dbP;
      dbP = new Promise(function(res, rej){
        var r = indexedDB.open('faceos_vfs', 1);
        r.onupgradeneeded = function(){
          var db = r.result;
          if(!db.objectStoreNames.contains('files')) db.createObjectStore('files', {keyPath:'path'});
        };
        r.onsuccess = function(){ res(r.result); };
        r.onerror = function(){ rej(r.error); };
      });
      return dbP;
    }
    function put(path, content, meta){
      return open().then(function(db){
        return new Promise(function(res, rej){
          var tx = db.transaction('files', 'readwrite');
          var size = typeof content==='string' ? new Blob([content]).size : (content.byteLength||0);
          var rec = Object.assign({path:path, content:content, size:size, created:Date.now()}, meta||{});
          var req = tx.objectStore('files').put(rec);
          req.onsuccess = function(){ res(req.result); };
          req.onerror = function(){ rej(req.error); };
        });
      });
    }
    function get(path){
      return open().then(function(db){
        return new Promise(function(res, rej){
          var tx = db.transaction('files', 'readonly');
          var req = tx.objectStore('files').get(path);
          req.onsuccess = function(){ res(req.result||null); };
          req.onerror = function(){ rej(req.error); };
        });
      });
    }
    function del(path){
      return open().then(function(db){
        return new Promise(function(res, rej){
          var tx = db.transaction('files', 'readwrite');
          var req = tx.objectStore('files').delete(path);
          req.onsuccess = function(){ res(); };
          req.onerror = function(){ rej(req.error); };
        });
      });
    }
    function list(prefix){
      return open().then(function(db){
        return new Promise(function(res, rej){
          var tx = db.transaction('files', 'readonly');
          var req = tx.objectStore('files').getAll();
          req.onsuccess = function(){
            var items = req.result;
            if(prefix) items = items.filter(function(x){return x.path.indexOf(prefix)===0;});
            res(items);
          };
          req.onerror = function(){ rej(req.error); };
        });
      });
    }
    function usage(){
      return list().then(function(items){
        var used = items.reduce(function(s,x){return s+(x.size||0);},0);
        return {used:used, total:TOTAL, percent:(used/TOTAL)*100};
      });
    }
    function clear(){
      return open().then(function(db){
        return new Promise(function(res, rej){
          var tx = db.transaction('files', 'readwrite');
          var req = tx.objectStore('files').clear();
          req.onsuccess = function(){ res(); };
          req.onerror = function(){ rej(req.error); };
        });
      });
    }
    return {put:put, get:get, del:del, list:list, usage:usage, clear:clear, TOTAL:TOTAL};
  })();

  var FPM = (function(){
    var PATH = '/usr/packages/';
    function listInstalled(){
      return VFS.list(PATH).then(function(items){
        var s = {};
        items.forEach(function(x){
          var m = x.path.replace(PATH,'').split('/')[0];
          if(m) s[m]=1;
        });
        return Object.keys(s);
      });
    }
    function isInstalled(pkg){
      return VFS.get(PATH+pkg+'/.installed').then(function(f){ return !!f; });
    }
    function info(pkg){
      var r = PACKAGES[pkg];
      if(!r) throw new Error("Package '"+pkg+"' not found");
      return isInstalled(pkg).then(function(i){ return Object.assign({}, r, {installed:i}); });
    }
    function install(pkg, log){
      var r = PACKAGES[pkg];
      if(!r) return Promise.reject(new Error('E: Unable to locate package '+pkg));
      return isInstalled(pkg).then(function(i){
        if(i) throw new Error(pkg+' is already installed');
        log && log('Reading package lists... Done');
        log && log('The following NEW packages will be installed:');
        log && log('  '+pkg);
        return new Promise(function(res){ setTimeout(res,400); });
      }).then(function(){
        log && log('Downloading '+pkg+'...');
        return new Promise(function(res){ setTimeout(res,300); });
      }).then(function(){
        log && log('Unpacking '+pkg+'...');
        return VFS.put(PATH+pkg+'/.installed', new Date().toISOString(), {pkg:pkg});
      }).then(function(){
        log && log('✓ '+pkg+' installed successfully.');
        return true;
      });
    }
    function uninstall(pkg, log){
      return isInstalled(pkg).then(function(i){
        if(!i) throw new Error(pkg+' is not installed');
        log && log('Removing '+pkg+'...');
        return VFS.list(PATH+pkg+'/');
      }).then(function(items){
        return items.reduce(function(p, item){ return p.then(function(){ return VFS.del(item.path); }); }, Promise.resolve());
      }).then(function(){
        log && log('✓ '+pkg+' removed.');
        return true;
      });
    }
    function search(q){
      q = (q||'').toLowerCase();
      return Object.keys(PACKAGES).filter(function(k){
        return !q || k.indexOf(q)>=0 || PACKAGES[k].desc.toLowerCase().indexOf(q)>=0;
      }).map(function(k){ return Object.assign({name:k}, PACKAGES[k]); });
    }
    function run(pkg, args){
      var r = PACKAGES[pkg];
      if(!r) throw new Error('Package not found');
      return isInstalled(pkg).then(function(i){
        if(!i) throw new Error("'"+pkg+"' is not installed. Run: fpm install "+pkg);
        return r.run(args||[]);
      });
    }
    return {listInstalled:listInstalled, isInstalled:isInstalled, info:info, install:install, uninstall:uninstall, search:search, run:run, PATH:PATH};
  })();

  /* ============ MUSIC ============ */
  var MusicPlayer = (function(){
    var audio = $('audio');
    var playlist = [];
    var currentIdx = -1;
    var isPlaying = false;
    var subs = [];
    function notify(){ subs.forEach(function(fn){ fn(); }); updateMini(); }
    function subscribe(fn){ subs.push(fn); fn(); return function(){ subs = subs.filter(function(f){return f!==fn;}); }; }
    function addFiles(files){
      return Promise.all(Array.prototype.map.call(files, function(file){
        var url = URL.createObjectURL(file);
        return new Promise(function(res){
          var a = new Audio();
          a.preload = 'metadata';
          a.onloadedmetadata = function(){ res({id:Date.now()+'_'+Math.random().toString(36).slice(2), name:file.name.replace(/\.[^.]+$/,''), file:file, url:url, duration:a.duration||0, artist:'Local'}); };
          a.onerror = function(){ res({id:Date.now()+'_'+Math.random().toString(36).slice(2), name:file.name, file:file, url:url, duration:0, artist:'Local'}); };
          a.src = url;
        });
      })).then(function(tracks){ playlist = playlist.concat(tracks); notify(); return tracks; });
    }
    function play(idx){
      if(idx !== undefined) currentIdx = idx;
      if(currentIdx < 0 && playlist.length) currentIdx = 0;
      if(currentIdx < 0) return;
      audio.src = playlist[currentIdx].url;
      audio.play().then(function(){ isPlaying = true; updateMediaSession(); notify(); })
        .catch(function(){ toast('Play error'); isPlaying = false; notify(); });
    }
    function pause(){ audio.pause(); isPlaying = false; notify(); }
    function toggle(){ if(isPlaying) pause(); else play(); }
    function next(){ if(!playlist.length) return; currentIdx = (currentIdx+1)%playlist.length; play(); }
    function prev(){ if(!playlist.length) return; if(audio.currentTime>3){ audio.currentTime=0; return; } currentIdx = (currentIdx-1+playlist.length)%playlist.length; play(); }
    function seek(t){ if(audio.duration) audio.currentTime = t; }
    function remove(idx){
      if(idx < 0 || idx >= playlist.length) return;
      URL.revokeObjectURL(playlist[idx].url);
      var wasCur = idx === currentIdx;
      playlist.splice(idx,1);
      if(wasCur){ audio.pause(); isPlaying=false; if(currentIdx>=playlist.length) currentIdx = playlist.length-1; if(currentIdx>=0) play(); else { audio.src=''; notify(); } }
      else { if(idx<currentIdx) currentIdx--; notify(); }
    }
    function clear(){
      audio.pause(); audio.src='';
      playlist.forEach(function(p){ URL.revokeObjectURL(p.url); });
      playlist = []; currentIdx = -1; isPlaying = false; notify();
    }
    function setVolume(v){ audio.volume = Math.max(0, Math.min(1, v)); }
    function updateMediaSession(){
      if(!('mediaSession' in navigator)) return;
      try{
        var t = playlist[currentIdx]; if(!t) return;
        navigator.mediaSession.metadata = new MediaMetadata({title:t.name, artist:t.artist, album:'FaceOS'});
        navigator.mediaSession.setActionHandler('play', function(){ play(); });
        navigator.mediaSession.setActionHandler('pause', function(){ pause(); });
        navigator.mediaSession.setActionHandler('previoustrack', prev);
        navigator.mediaSession.setActionHandler('nexttrack', next);
      }catch(e){}
    }
    function updateMini(){
      var cur = playlist[currentIdx];
      var m = $('mini');
      if(!cur){ m.classList.remove('visible'); return; }
      $('miniTitle').textContent = cur.name;
      $('miniArtist').textContent = cur.artist;
      $('miniPlay').textContent = isPlaying ? '⏸' : '▶';
      var musicOpen = state.windows.some(function(w){ return w.appId === 'music'; });
      if(musicOpen) m.classList.remove('visible');
      else m.classList.add('visible');
    }
    audio.addEventListener('timeupdate', notify);
    audio.addEventListener('ended', next);
    audio.addEventListener('play', function(){ isPlaying=true; notify(); });
    audio.addEventListener('pause', function(){ isPlaying=false; notify(); });
    return {
      subscribe:subscribe, addFiles:addFiles, play:play, pause:pause, toggle:toggle,
      next:next, prev:prev, seek:seek, remove:remove, clear:clear, setVolume:setVolume,
      getState: function(){ return {playlist:playlist, currentIdx:currentIdx, isPlaying:isPlaying, current:playlist[currentIdx]||null}; },
      get audio(){ return audio; }
    };
  })();

  $('miniPrev').addEventListener('click', function(e){ e.stopPropagation(); MusicPlayer.prev(); });

  /* ============ WINDOW MANAGER ============ */
  function openApp(appId){
    var ex = state.windows.find(function(w){return w.appId === appId && !w.minimized;});
    if(ex){ focusWindow(ex.id); return; }
    var app = APPS.find(function(a){return a.id === appId;}); if(!app) return;
    SoundEngine.wopen();
    var id = ++state.winId;
    var win = document.createElement('div');
    win.className = 'window'; win.dataset.id = id;
    win.style.zIndex = ++state.zTop;
    var n = state.windows.length;
    win.style.left = (40+n*24)+'px'; win.style.top = (60+n*24)+'px';
    win.innerHTML = '<div class="titlebar"><div class="traffic"><span class="t-red" data-act="close"></span><span class="t-yellow" data-act="min"></span><span class="t-green" data-act="max"></span></div><div class="wtitle">'+app.name+'</div><div style="width:44px"></div></div><div class="wbody"></div>';
    document.body.appendChild(win);
    var body = win.querySelector('.wbody');
    try{ app.build(body); }catch(e){ body.innerHTML = '<div style="padding:20px">Error: '+e.message+'</div>'; }
    win.querySelectorAll('.traffic span').forEach(function(sp){
      sp.addEventListener('click', function(e){
        e.stopPropagation();
        var act = sp.dataset.act;
        if(act === 'close') closeWindow(id);
        if(act === 'min') minimizeWindow(id);
        if(act === 'max') toggleMaximize(id);
      });
    });
    makeDraggable(win, win.querySelector('.titlebar'));
    win.addEventListener('mousedown', function(){ focusWindow(id); });
    win.addEventListener('touchstart', function(){ focusWindow(id); }, {passive:true});
    state.windows.push({id:id, appId:appId, title:app.name, el:win, maximized:false, prevRect:null, minimized:false});
    document.querySelectorAll('.dock .app[data-app="'+appId+'"]').forEach(function(el){ el.classList.add('running'); });
  }
  function closeWindow(id){
    var w = state.windows.find(function(x){return x.id === id;}); if(!w) return;
    SoundEngine.wclose();
    w.el.classList.add('closing');
    setTimeout(function(){
      w.el.remove();
      state.windows = state.windows.filter(function(x){return x.id !== id;});
      document.querySelectorAll('.dock .app[data-app="'+w.appId+'"]').forEach(function(el){
        if(!state.windows.some(function(x){return x.appId === w.appId;})) el.classList.remove('running');

  function focusWindow(id){ var w = state.windows.find(function(x){return x.id === id;}); if(w) w.el.style.zIndex = ++state.zTop; }
  function minimizeWindow(id){
    var w = state.windows.find(function(x){return x.id === id;}); if(!w) return;
    SoundEngine.click();
    w.el.style.display = 'none'; w.minimized = true;
  }
  function restoreWindow(id){
    var w = state.windows.find(function(x){return x.id === id;}); if(!w) return;
    w.el.style.display = ''; w.minimized = false; focusWindow(id);
  }
  function toggleMaximize(id){
    var w = state.windows.find(function(x){return x.id === id;}); if(!w) return;
    SoundEngine.click();
    var el = w.el;
    if(!w.maximized){
      w.prevRect = {left:el.style.left, top:el.style.top, width:el.style.width, height:el.style.height};
      el.style.transition = 'all .2s';
      el.style.left = '0'; el.style.top = '30px';
      el.style.width = '100vw'; el.style.height = 'calc(100vh - 30px)';
      el.style.borderRadius = '0'; w.maximized = true;
    } else {
      el.style.transition = 'all .2s';
      el.style.left = w.prevRect.left; el.style.top = w.prevRect.top;
      el.style.width = w.prevRect.width; el.style.height = w.prevRect.height;
      el.style.borderRadius = '12px'; w.maximized = false;
    }
  }
  function makeDraggable(win, handle){
    var sx=0, sy=0, ol=0, ot=0, drag=false;
    var down = function(e){
      if(e.target.closest('.traffic')) return;
      var st = state.windows.find(function(w){return w.el === win;});
      if(st && st.maximized) return;
      drag = true;
      var p = e.touches ? e.touches[0] : e;
      sx = p.clientX; sy = p.clientY;
      ol = parseInt(win.style.left)||0; ot = parseInt(win.style.top)||0;
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
      document.addEventListener('touchmove', move, {passive:false});
      document.addEventListener('touchend', up);
    };
    var move = function(e){
      if(!drag) return; e.preventDefault && e.preventDefault();
      var p = e.touches ? e.touches[0] : e;
      win.style.left = (ol+p.clientX-sx)+'px';
      win.style.top = (ot+p.clientY-sy)+'px';
    };
    var up = function(){
      drag = false;
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      document.removeEventListener('touchmove', move);
      document.removeEventListener('touchend', up);
    };
    handle.addEventListener('mousedown', down);
    handle.addEventListener('touchstart', down, {passive:false});
  }

  /* ============ APP: CALCULATOR ============ */
  function buildCalc(root){
    root.innerHTML = '<div class="calc"><div class="calc-screen" id="cd">0</div><div class="calc-keys">' +
      ['AC','+/-','%','/','7','8','9','*','4','5','6','-','1','2','3','+','0','.','='].map(function(k){
        var cls = 'calc-key';
        if(['/','*','-','+','='].indexOf(k)>=0) cls += ' op';
        if(['AC','+/-','%'].indexOf(k)>=0) cls += ' fn';
        if(k==='0') cls += ' zero';
        return '<button class="'+cls+'" data-k="'+k+'">'+k+'</button>';
      }).join('') + '</div></div>';
    var disp = root.querySelector('#cd');
    var cur = '0', prev = null, op = null, rst = false;
    var upd = function(){ disp.textContent = cur; disp.style.fontSize = cur.length>12?'24px':cur.length>8?'32px':'40px'; };
    var compute = function(a,b,o){ a=+a; b=+b; return o==='+'?a+b: o==='-'?a-b: o==='*'?a*b: o==='/'?(b===0?'Error':a/b):b; };
    root.querySelectorAll('.calc-key').forEach(function(b){
      b.addEventListener('click', function(){
        var k = b.dataset.k;
        SoundEngine.click();
        if(k>='0' && k<='9'){ if(rst){ cur = k; rst = false; } else cur = cur==='0' ? k : cur+k; }
        else if(k==='.'){ if(rst){ cur='0.'; rst=false; } else if(cur.indexOf('.')<0) cur += '.'; }
        else if(k==='AC'){ cur='0'; prev=null; op=null; rst=false; }
        else if(k==='+/-'){ cur = cur.charAt(0)==='-' ? cur.slice(1) : (cur!=='0' ? '-'+cur : cur); }
        else if(k==='%') cur = String(parseFloat(cur)/100);
        else if(['+','-','*','/'].indexOf(k)>=0){
          if(op !== null && !rst){ var r = compute(prev,cur,op); cur = String(r); prev = String(r); } else prev = cur;
          op = k; rst = true;
        } else if(k==='='){
          if(op !== null && prev !== null){ var r2 = compute(prev,cur,op); cur = String(Number.isFinite(r2) ? +r2.toFixed(10) : 'Error'); prev=null; op=null; rst=true; }
        }
        upd();
      });
    });
    upd();
  }

  /* ============ APP: TERMINAL ============ */
  function buildTerminal(root){
    root.innerHTML = '<div class="term"><div class="out"></div><input autocomplete="off" spellcheck="false"></div>';
    var out = root.querySelector('.out');
    var input = root.querySelector('input');
    var print = function(txt, cls){
      var d = document.createElement('div');
      if(cls) d.className = cls;
      d.textContent = txt;
      out.appendChild(d);
      out.scrollTop = out.scrollHeight;
    };
    print('FaceOS Terminal — type "help"', 'info');
    print('');
    var history = [], hIdx = 0;
    var run = function(cmd){
      cmd = cmd.trim(); if(!cmd){ print(''); return; }
      history.push(cmd); hIdx = history.length;
      var parts = cmd.split(/\s+/);
      var c = parts[0], args = parts.slice(1);
      if(c === 'help'){
        print('Commands: help, clear, echo, date, whoami, neofetch, df, ls', 'warn');
        print('fpm: install, list, search, remove, run', 'warn');
        print('music: play <n>, list, stop', 'warn');
      }
      else if(c === 'clear'){ out.innerHTML = ''; }
      else if(c === 'echo') print(args.join(' '));
      else if(c === 'date') print(new Date().toString());
      else if(c === 'whoami') print('faceos-user');
      else if(c === 'ls') print('documents  downloads  notes.txt');
      else if(c === 'df'){
        VFS.usage().then(function(u){ print('faceos-vfs '+(u.total/1024/1024).toFixed(0)+'M used '+(u.used/1024).toFixed(0)+'K'); });
      }
      else if(c === 'neofetch'){
        VFS.usage().then(function(u){
          FPM.listInstalled().then(function(inst){
            print('    OS: FaceOS 8.0', 'info');
            print('    Shell: faceos-sh', 'info');
            print('    Packages: '+inst.length, 'info');
            print('    Storage: '+(u.used/1024).toFixed(1)+'K', 'info');
          });
        });
      }
      else if(c === 'music'){
        var sub = args[0];
        if(sub === 'list'){
          var st = MusicPlayer.getState();
          if(!st.playlist.length) print('No tracks', 'warn');
          else st.playlist.forEach(function(t, i){ print('  '+(i+1)+'. '+t.name); });
        } else if(sub === 'play'){
          var n = parseInt(args[1], 10); if(isNaN(n)){ print('Usage: music play <n>', 'err'); return; }
          MusicPlayer.play(n-1); print('▶ Playing...', 'ok');
        } else if(sub === 'stop'){ MusicPlayer.pause(); print('⏸ Stopped', 'ok'); }
        else print('Usage: music list | play <n> | stop', 'warn');
      }
      else if(c === 'fpm'){
        var sub = args[0], rest = args.slice(1);
        if(sub === 'list'){
          FPM.listInstalled().then(function(inst){
            if(!inst.length) print('No packages installed', 'warn');
            else inst.forEach(function(p){ print('  📦 '+p, 'ok'); });
          });
        }
        else if(sub === 'search'){ FPM.search(rest.join(' ')).forEach(function(p){ print('  '+p.icon+' '+p.name+' — '+p.desc); }); }
        else if(sub === 'install'){
          if(!rest[0]){ print('Usage: fpm install <pkg>', 'err'); return; }
          FPM.install(rest[0], function(m){ print(m, 'info'); }).then(function(){ SoundEngine.ok(); toast('✓ '+rest[0]+' installed'); }).catch(function(e){ print('E: '+e.message, 'err'); SoundEngine.err(); });
        }
        else if(sub === 'remove'){
          if(!rest[0]){ print('Usage: fpm remove <pkg>', 'err'); return; }
          FPM.uninstall(rest[0], function(m){ print(m, 'info'); }).then(function(){ SoundEngine.ok(); toast('✓ removed'); }).catch(function(e){ print('E: '+e.message, 'err'); });
        }
        else if(sub === 'run'){
          FPM.run(rest[0], rest.slice(1)).then(function(r){ if(r) print(String(r), 'ok'); }).catch(function(e){ print('E: '+e.message, 'err'); });
        }
        else print('fpm: list, search, install, remove, run', 'warn');
      }
      else {
        FPM.isInstalled(c).then(function(ok){
          if(!ok){ print('faceos-sh: command not found: '+c, 'err'); return; }
          FPM.run(c, args).then(function(r){ if(r) print(String(r), 'ok'); }).catch(function(e){ print('E: '+e.message, 'err'); });
        });
      }
    };
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ print('user@faceos:~$ '+input.value, 'info'); run(input.value); input.value = ''; }
      else if(e.key === 'ArrowUp'){ if(hIdx > 0){ hIdx--; input.value = history[hIdx]||''; e.preventDefault(); } }
      else if(e.key === 'ArrowDown'){ if(hIdx < history.length-1){ hIdx++; input.value = history[hIdx]||''; } else { hIdx = history.length; input.value = ''; } e.preventDefault(); }
    });
    setTimeout(function(){ input.focus(); }, 100);
  }

  /* ============ APP: BROWSER ============ */
  function buildBrowser(root){
    root.innerHTML = '<div class="browser"><div class="browser-bar"><button data-b="back">◀</button><button data-b="fwd">▶</button><button data-b="reload">⟳</button><button data-b="home">⌂</button><button data-b="ext">↗</button><input placeholder="Search or URL..."></div><div class="browser-view"></div></div>';
    var input = root.querySelector('input'), view = root.querySelector('.browser-view');
    var hist = [], idx = -1;
    var home = function(){
      view.innerHTML = '<div style="text-align:center;padding:30px;color:#333;width:100%"><div style="font-size:56px;margin-bottom:14px">🌐</div><h3>Browser</h3><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px"><a data-q="https://duckduckgo.com" style="cursor:pointer;padding:12px 18px;background:#eee;border-radius:10px">🦆 DuckDuckGo</a><a data-q="https://en.wikipedia.org" style="cursor:pointer;padding:12px 18px;background:#eee;border-radius:10px">📚 Wikipedia</a></div></div>';
      view.querySelectorAll('a').forEach(function(a){ a.addEventListener('click', function(){ input.value = a.dataset.q; navigate(a.dataset.q); }); });
    };
    var norm = function(u){ u = u.trim(); if(!u) return ''; if(!/^https?:\/\//i.test(u) && u.indexOf('.') < 0) return 'https://duckduckgo.com/?q='+encodeURIComponent(u); if(!/^https?:\/\//i.test(u)) u = 'https://'+u; return u; };
    var navigate = function(u){ var f = norm(u); if(!f) return; hist.splice(idx+1); hist.push(f); idx = hist.length-1; load(f); };
    var load = function(url){
      view.innerHTML = '<iframe src="'+url+'" sandbox="allow-same-origin allow-scripts allow-forms allow-popups" referrerpolicy="no-referrer"></iframe><div class="fb" style="display:none;position:absolute;inset:0;background:#fff;padding:30px;text-align:center;color:#333"><h3>Can\'t embed</h3><button class="ext" style="margin-top:14px;padding:12px 24px;background:#0A84FF;color:#fff;border:none;border-radius:10px;cursor:pointer">↗ Open externally</button></div>';
      var iframe = view.querySelector('iframe'), fb = view.querySelector('.fb');
      var loaded = false;
      iframe.addEventListener('load', function(){ loaded = true; });
      setTimeout(function(){ if(!loaded){ iframe.style.display = 'none'; fb.style.display = 'block'; } }, 4000);
      fb.querySelector('.ext').addEventListener('click', function(){ window.open(url, '_blank'); });
      input.value = url;
    };
    input.addEventListener('keydown', function(e){ if(e.key === 'Enter') navigate(input.value); });
    root.querySelectorAll('[data-b]').forEach(function(b){
      b.addEventListener('click', function(){
        var a = b.dataset.b;
        if(a === 'back' && idx > 0){ idx--; load(hist[idx]); }
        if(a === 'fwd' && idx < hist.length-1){ idx++; load(hist[idx]); }
        if(a === 'reload' && idx >= 0) load(hist[idx]);
        if(a === 'home'){ hist = []; idx = -1; input.value = ''; home(); }
        if(a === 'ext'){ var u = norm(input.value); if(u) window.open(u, '_blank'); }
      });
    });
    home();
  }

  /* ============ APP: FILES ============ */
  function buildFiles(root){
    root.innerHTML = '<div class="files"><div class="files-toolbar"><button data-f="up">↑ Up</button><button data-f="real">📂 Open Real Folder</button></div><div class="files-list"></div></div>';
    var list = root.querySelector('.files-list');
    var cwd = '/usr/packages';
    var render = function(){
      VFS.list(cwd+'/').then(function(items){
        var folders = {};
        items.forEach(function(it){
          var rel = it.path.replace(cwd+'/', '');
          if(!rel) return;
          var top = rel.split('/')[0];
          if(!folders[top]) folders[top] = {name:top, isFolder: rel.split('/').length>1, size:0};
          if(rel.split('/').length === 1) folders[top].size = it.size;
        });
        var keys = Object.keys(folders);
        if(!keys.length){ list.innerHTML = '<div style="padding:20px;text-align:center;opacity:.5">Empty</div>'; return; }
        list.innerHTML = '';
        keys.forEach(function(n){
          var f = folders[n];
          var r = document.createElement('div');
          r.style.cssText = 'display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px';
          r.innerHTML = '<span style="font-size:22px">'+(f.isFolder?'📁':'📄')+'</span><span>'+n+'</span><span style="flex:1"></span><span style="opacity:.5;font-size:12px">'+(f.isFolder?'':(f.size/1024).toFixed(1)+' KB')+'</span>';
          r.addEventListener('click', function(){ SoundEngine.click(); if(f.isFolder){ cwd = cwd+'/'+n; render(); } });
          r.addEventListener('mouseover', function(){ r.style.background = 'var(--hover)'; });
          r.addEventListener('mouseout', function(){ r.style.background = ''; });
          list.appendChild(r);
        });
      });
    };
    root.querySelector('[data-f="up"]').addEventListener('click', function(){ SoundEngine.click(); cwd = cwd.split('/').slice(0,-1).join('/') || '/'; render(); });
    root.querySelector('[data-f="real"]').addEventListener('click', function(){
      if(!window.showDirectoryPicker){ toast('Not supported'); return; }
      window.showDirectoryPicker().then(function(dir){
        list.innerHTML = '';
        var iter = function(iterator){
          iterator.next().then(function(res){
            if(res.done) return;
            var h = res.value;
            var r = document.createElement('div');
            r.style.cssText = 'display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px';
            r.innerHTML = '<span style="font-size:22px">'+(h.kind==='directory'?'📁':'📄')+'</span><span>'+h.name+'</span>';
            r.addEventListener('click', function(){ if(h.kind === 'file') h.getFile().then(function(f){ window.open(URL.createObjectURL(f), '_blank'); }); });
            list.appendChild(r);
            iter(iterator);
          });
        };
        iter(dir.values());
      }).catch(function(){});
    });
    render();
  }

  /* ============ APP: PHOTOS ============ */
  function buildPhotos(root){
    root.innerHTML = '<div class="photos"><h3 style="font-size:15px;margin-bottom:12px">📷 Gallery</h3><div class="photos-grid"></div></div>';
    var grid = root.querySelector('.photos-grid');
    var render = function(){
      PhotoDB.all().then(function(items){
        grid.innerHTML = '';
        if(!items.length){ grid.innerHTML = '<div class="photo empty">No photos. Use Camera.</div>'; return; }
        items.forEach(function(rec){
          var url = URL.createObjectURL(rec.blob);
          var tile = document.createElement('div');
          tile.className = 'photo';
          tile.innerHTML = '<img src="'+url+'"><div class="del" data-del="'+rec.id+'">✕</div>';
          tile.addEventListener('click', function(e){
            if(e.target.closest('.del')) return;
            $('viewerImg').src = url; $('viewer').classList.add('open');
          });
          tile.querySelector('.del').addEventListener('click', function(e){
            e.stopPropagation();
            if(!confirm('Delete?')) return;
            PhotoDB.remove(rec.id).then(function(){ URL.revokeObjectURL(url); render(); });
          });
          grid.appendChild(tile);
        });
      });
    };
    render();
  }

  /* ============ APP: CAMERA ============ */
  function buildCamera(root){
    root.innerHTML = '<div class="camapp"><video autoplay playsinline muted></video><div style="display:flex;gap:10px;justify-content:center"><button id="cs">📸 Capture</button><button id="cx" class="alt">Stop</button></div></div>';
    var v = root.querySelector('video'), stream = null;
    navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:false})
      .then(function(s){ stream = s; v.srcObject = s; })
      .catch(function(){ root.querySelector('.camapp').innerHTML = '<div style="color:#fff;text-align:center;padding:30px">Camera denied</div>'; });
    root.querySelector('#cs').addEventListener('click', function(){
      if(!v.videoWidth){ toast('Not ready'); return; }
      SoundEngine.ok();
      var size = Math.min(v.videoWidth, v.videoHeight);
      var sx = (v.videoWidth-size)/2, sy = (v.videoHeight-size)/2;
      var c = document.createElement('canvas'); c.width = c.height = 600;
      var ctx = c.getContext('2d'); ctx.translate(600,0); ctx.scale(-1,1);
      ctx.drawImage(v, sx, sy, size, size, 0, 0, 600, 600);
      c.toBlob(function(b){ PhotoDB.add(b, {kind:'camera'}).then(function(){ toast('✅ Saved'); }); }, 'image/jpeg', 0.88);
    });
    root.querySelector('#cx').addEventListener('click', function(){ if(stream) stream.getTracks().forEach(function(t){ t.stop(); }); toast('Stopped'); });
  }

  /* ============ APP: PAINT ============ */
  function buildPaint(root){
    root.innerHTML = '<div style="display:flex;flex-direction:column;height:100%;background:#fff">' +
      '<div style="display:flex;gap:6px;padding:8px;background:var(--title);border-bottom:1px solid var(--border);flex-wrap:wrap">' +
        '<input type="color" id="pc" value="#ff0055" style="width:40px;height:32px;border:none;background:transparent"/>' +
        '<input type="range" id="ps" min="1" max="40" value="6" style="width:100px"/>' +
        '<button id="pclr" style="padding:6px 12px;border-radius:6px;background:var(--hover);color:var(--text);border:none;cursor:pointer">Clear</button>' +
        '<button id="psv" style="padding:6px 12px;border-radius:6px;background:var(--hover);color:var(--text);border:none;cursor:pointer">Save</button>' +
      '</div>' +
      '<canvas style="flex:1;touch-action:none;cursor:crosshair"></canvas>' +
    '</div>';
    var c = root.querySelector('canvas'), ctx = c.getContext('2d');
    var resize = function(){ var r = c.getBoundingClientRect(); c.width = r.width; c.height = r.height; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); };
    setTimeout(resize, 80);
    var drawing = false;
    var pos = function(e){ var r = c.getBoundingClientRect(); var p = e.touches ? e.touches[0] : e; return {x:p.clientX - r.left, y:p.clientY - r.top}; };
    var start = function(e){ drawing = true; var p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
    var draw = function(e){ if(!drawing) return; if(e.preventDefault) e.preventDefault(); var p = pos(e); ctx.lineWidth = +root.querySelector('#ps').value; ctx.strokeStyle = root.querySelector('#pc').value; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineTo(p.x, p.y); ctx.stroke(); };
    var stop = function(){ drawing = false; };
    c.addEventListener('mousedown', start); c.addEventListener('mousemove', draw); c.addEventListener('mouseup', stop); c.addEventListener('mouseleave', stop);
    c.addEventListener('touchstart', start, {passive:false}); c.addEventListener('touchmove', draw, {passive:false}); c.addEventListener('touchend', stop);
    root.querySelector('#pclr').addEventListener('click', function(){ ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); });
    root.querySelector('#psv').addEventListener('click', function(){ c.toBlob(function(b){ PhotoDB.add(b, {kind:'paint'}).then(function(){ toast('✅ Saved'); }); }, 'image/png'); });
  }

  /* ============ APP: SNAKE ============ */
  function buildSnake(root){
    root.innerHTML = '<div class="game"><div class="score">Score: <span id="sn">0</span></div><canvas width="340" height="340"></canvas></div>';
    var c = root.querySelector('canvas'), ctx = c.getContext('2d');
    var cell = 17, N = c.width / cell;
    var snake = [{x:8,y:8}], dir = {x:1,y:0}, food = {x:12,y:12}, score = 0, loop;
    var place = function(){ food = {x:Math.floor(Math.random()*N), y:Math.floor(Math.random()*N)}; };
    var draw = function(){ ctx.fillStyle = '#111'; ctx.fillRect(0,0,c.width,c.height); ctx.fillStyle = '#ff3b30'; ctx.fillRect(food.x*cell, food.y*cell, cell-2, cell-2); ctx.fillStyle = '#0f0'; snake.forEach(function(s){ ctx.fillRect(s.x*cell, s.y*cell, cell-2, cell-2); }); };
    var step = function(){
      if(!document.body.contains(c)){ clearInterval(loop); return; }
      var h = {x:(snake[0].x+dir.x+N)%N, y:(snake[0].y+dir.y+N)%N};
      if(snake.some(function(s){ return s.x===h.x && s.y===h.y; })){ clearInterval(loop); toast('Game over! Score: '+score); return; }
      snake.unshift(h);
      if(h.x===food.x && h.y===food.y){ score++; root.querySelector('#sn').textContent = score; place(); }
      else snake.pop();
      draw();
    };
    draw(); loop = setInterval(step, 140);
    var key = function(e){
      var k = e.key;
      if(k==='ArrowUp' && dir.y!==1) dir = {x:0,y:-1};
      if(k==='ArrowDown' && dir.y!==-1) dir = {x:0,y:1};
      if(k==='ArrowLeft' && dir.x!==1) dir = {x:-1,y:0};
      if(k==='ArrowRight' && dir.x!==-1) dir = {x:1,y:0};
    };
    document.addEventListener('keydown', key);
    var tsx=0, tsy=0;
    c.addEventListener('touchstart', function(e){ tsx = e.touches[0].clientX; tsy = e.touches[0].clientY; }, {passive:true});
    c.addEventListener('touchend', function(e){
      var dx = e.changedTouches[0].clientX - tsx;
      var dy = e.changedTouches[0].clientY - tsy;
      if(Math.abs(dx) > Math.abs(dy)){ if(dx>20 && dir.x!==-1) dir = {x:1,y:0}; if(dx<-20 && dir.x!==1) dir = {x:-1,y:0}; }
      else { if(dy>20 && dir.y!==-1) dir = {x:0,y:1}; if(dy<-20 && dir.y!==1) dir = {x:0,y:-1}; }
    });
  }

  /* ============ APP: TIC TAC TOE ============ */
  function buildTicTacToe(root){
    var board = ['','','','','','','','',''];
    var turn = 'X', done = false, score = {X:0,O:0,D:0};
    var checkWin = function(){
      var L = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      for(var i=0;i<L.length;i++){ var a=L[i][0], b=L[i][1], c=L[i][2]; if(board[a] && board[a]===board[b] && board[a]===board[c]) return board[a]; }
      return board.every(function(x){ return x; }) ? 'D' : null;
    };
    var render = function(){
      root.innerHTML = '<div style="padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px">' +
        '<div style="font-size:16px">Turn: <b>'+turn+'</b></div>' +
        '<div style="display:grid;grid-template-columns:repeat(3,70px);gap:6px">' +
          board.map(function(v,i){ return '<button data-i="'+i+'" style="width:70px;height:70px;font-size:32px;font-weight:700;background:var(--panel);color:var(--text);border-radius:10px;border:1px solid var(--border);cursor:pointer">'+v+'</button>'; }).join('') +
        '</div>' +
        '<div style="font-size:14px;opacity:.7">X:'+score.X+'  O:'+score.O+'  D:'+score.D+'</div>' +
        '<button id="ttt-reset" style="padding:8px 16px;border-radius:8px;background:#0A84FF;color:#fff;border:none;cursor:pointer">New Game</button>' +
      '</div>';
      root.querySelectorAll('[data-i]').forEach(function(b){
        b.addEventListener('click', function(){
          var i = +b.dataset.i; if(board[i] || done) return;
          board[i] = turn;
          var w = checkWin();
          if(w){ done = true; score[w]++; toast(w==='D' ? 'Draw!' : w+' wins!'); render(); return; }
          turn = turn === 'X' ? 'O' : 'X'; render();
        });
      });
      root.querySelector('#ttt-reset').addEventListener('click', function(){ board = ['','','','','','','','','']; turn = 'X'; done = false; render(); });
    };
    render();
  }

  /* ============ APP: TO-DO ============ */
  function buildTodo(root){
    var items = JSON.parse(localStorage.getItem('faceos_todo') || '[]');
    var save = function(){ localStorage.setItem('faceos_todo', JSON.stringify(items)); };
    var render = function(){
      root.innerHTML = '<div style="padding:20px;display:flex;flex-direction:column;gap:12px;height:100%">' +
        '<div style="display:flex;gap:8px">' +
          '<input id="ti" placeholder="New task..." style="flex:1;padding:10px;border-radius:8px;background:var(--panel);color:var(--text);border:1px solid var(--border)"/>' +
          '<button id="ta" style="padding:10px 16px;border-radius:8px;background:#0A84FF;color:#fff;border:none;cursor:pointer">Add</button>' +
        '</div>' +
        '<div style="flex:1;overflow-y:auto">' +
          (items.map(function(it, i){
            return '<div style="display:flex;gap:10px;padding:10px;border-radius:8px;background:var(--panel);margin-bottom:6px;align-items:center">' +
              '<input type="checkbox" data-i="'+i+'" '+(it.done?'checked':'')+'/>' +
              '<span style="flex:1;'+(it.done?'text-decoration:line-through;opacity:.5':'')+'">'+it.text+'</span>' +
              '<button data-del="'+i+'" style="background:transparent;color:#ff5f57;font-size:16px;border:none;cursor:pointer">✕</button>' +
            '</div>';
          }).join('') || '<div style="text-align:center;padding:20px;opacity:.5">No tasks</div>') +
        '</div>' +
      '</div>';
      root.querySelector('#ta').addEventListener('click', function(){ var v = root.querySelector('#ti').value.trim(); if(!v) return; items.push({text:v, done:false}); save(); render(); });
      root.querySelector('#ti').addEventListener('keydown', function(e){ if(e.key==='Enter') root.querySelector('#ta').click(); });
      root.querySelectorAll('[data-i]').forEach(function(cb){ cb.addEventListener('change', function(){ items[+cb.dataset.i].done = cb.checked; save(); render(); }); });
      root.querySelectorAll('[data-del]').forEach(function(b){ b.addEventListener('click', function(){ items.splice(+b.dataset.del, 1); save(); render(); }); });
    };
    render();
  }

  /* ============ APP: CALENDAR ============ */
  function buildCalendar(root){
    var cur = new Date();
    var render = function(){
      var y = cur.getFullYear(), m = cur.getMonth();
      var first = new Date(y, m, 1).getDay();
      var days = new Date(y, m+1, 0).getDate();
      var mn = cur.toLocaleDateString(LANG==='fa' ? 'fa-IR' : 'en-US', {month:'long', year:'numeric'});
      var cells = [];
      for(var i=0;i<first;i++) cells.push('');
      for(var d=1;d<=days;d++) cells.push(d);
      var today = new Date();
      root.innerHTML = '<div style="padding:20px">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">' +
          '<button id="cp" style="padding:6px 12px;border-radius:6px;background:var(--hover);color:var(--text);border:none;cursor:pointer">‹</button>' +
          '<h3>'+mn+'</h3>' +
          '<button id="cn" style="padding:6px 12px;border-radius:6px;background:var(--hover);color:var(--text);border:none;cursor:pointer">›</button>' +
        '</div>' +
        '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px">' +
          ['S','M','T','W','T','F','S'].map(function(d){ return '<b style="opacity:.6;padding:6px">'+d+'</b>'; }).join('') +
          cells.map(function(d){ var isToday = d && d === today.getDate() && m === today.getMonth() && y === today.getFullYear(); return '<div style="padding:8px;border-radius:6px;'+(isToday?'background:#0A84FF;color:#fff;font-weight:700':'')+'">'+d+'</div>'; }).join('') +
        '</div>' +
      '</div>';
      root.querySelector('#cp').addEventListener('click', function(){ cur.setMonth(cur.getMonth()-1); render(); });
      root.querySelector('#cn').addEventListener('click', function(){ cur.setMonth(cur.getMonth()+1); render(); });
    };
    render();
  }

        '</div>' +
        '<h3>Storage</h3>' +
        '<div style="padding:12px;background:var(--panel);border-radius:10px;border:1px solid var(--border)">' +
          '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px"><span>Virtual disk</span><span>'+(u.used/1024).toFixed(1)+' KB / '+(u.total/1024/1024).toFixed(0)+' MB</span></div>' +

      root.querySelector('#st').addEventListener('change', function(e){ state.theme = e.target.value; applyTheme(); });

  $('menuTheme').addEventListener('click', function(){ state.theme = state.theme === 'dark' ? 'light' : 'dark'; applyTheme(); SoundEngine.click(); });
  $('menuLang').addEventListener('click', function(){ LANG = LANG === 'fa' ? 'en' : 'fa'; applyLang(); SoundEngine.click(); });

  $('viewerClose').addEventListener('click', function(){ $('viewer').classList.remove('open'); });
  $('viewer').addEventListener('click', function(e){ if(e.target === $('viewer')) $('viewer').classList.remove('open'); });

  /* ============ BOOT ============ */

  runSplash().then(function(){ showPin(); });
})();
